<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form Demo — CareerPilot AI Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #090d16;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .form-card {
      width: 100%;
      max-width: 640px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .form-header {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .form-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }
    .form-header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <div class="badge">Google Form Simulation — Test Application</div>
    <div class="form-header">
      <h1>Software Engineer Application Form</h1>
      <p>Tech Innovations Inc. — Full Stack & Backend Position</p>
    </div>

    <form id="testApplicationForm" onsubmit="event.preventDefault(); alert('Form Submitted Successfully!');">
      <div class="form-group">
        <label for="full_name">Full Name *</label>
        <input type="text" id="full_name" name="full_name" placeholder="Your Full Name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="text" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
      </div>

      <div class="form-group">
        <label for="college">College / University *</label>
        <input type="text" id="college" name="college" placeholder="Your University Name" required>
      </div>

      <div class="form-group">
        <label for="degree">Degree & Major *</label>
        <input type="text" id="degree" name="degree" placeholder="e.g. B.S. Computer Science" required>
      </div>

      <div class="form-group">
        <label for="linkedin">LinkedIn Profile URL</label>
        <input type="text" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username">
      </div>

      <div class="form-group">
        <label for="github">GitHub Profile URL</label>
        <input type="text" id="github" name="github" placeholder="https://github.com/username">
      </div>

      <div class="form-group">
        <label for="summary">Brief Professional Summary</label>
        <textarea id="summary" name="summary" placeholder="Summary of your technical background..."></textarea>
      </div>

      <div class="form-group">
        <label for="why_join">Why do you want to join our team as a Software Engineer?</label>
        <textarea id="why_join" name="why_join" placeholder="Explain your motivation and interest in this role..."></textarea>
      </div>

      <div class="form-group">
        <label for="experience_details">Describe your technical experience with Python and backend development.</label>
        <textarea id="experience_details" name="experience_details" placeholder="Detail your relevant backend project experience..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>
    </form>
  </div>
</body>
</html>
